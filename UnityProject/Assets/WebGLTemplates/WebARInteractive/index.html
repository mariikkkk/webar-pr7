<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WebAR — перемещение и масштаб</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#151923}#unity-canvas{width:100%;height:100%;display:block}#overlay{position:fixed;inset:0;color:white;background:transparent;touch-action:none}#surface{position:absolute;inset:0;touch-action:none}.heading{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;right:20px;pointer-events:none;text-shadow:0 1px 6px #000}h1{font-size:22px;margin:0 0 9px}p{font-size:15px;line-height:1.4;margin:0;max-width:540px}.controls{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));margin:auto;max-width:520px;padding:16px;border-radius:16px;background:#fff;color:#182131;box-shadow:0 3px 22px #0003}button{min-height:46px;border:1px solid #c5ccd5;border-radius:10px;background:#f7f9fc;font-size:16px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#ar{background:#245bd6;color:white;border:none;flex:1}.buttons{display:flex;gap:10px;margin-top:12px}#status{font-size:15px;min-height:21px}#loading{position:absolute;top:45%;width:100%;text-align:center;font-size:20px;pointer-events:none}#error{color:#9b1515}body.ar{background:transparent}@media(max-width:480px){h1{font-size:20px}.heading p{font-size:14px}.controls{padding:12px}button{font-size:15px}}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="overlay">
 <div id="surface"></div>
 <div class="heading"><h1>Объект в ваших руках</h1><p>Потяните куб одним пальцем. Удерживая его, добавьте второй палец и разведите или сведите пальцы.</p></div>
 <div id="loading">Загрузка сцены… <span id="progress">0%</span></div>
 <div class="controls"><div id="status">Готовим сцену…</div><div id="error" role="alert"></div><div class="buttons"><button id="reset" disabled>Передо мной</button><button id="ar" disabled>Начать AR</button></div></div>
</div>
<script>
let unityInstance=null, xrSession=null, supported=false;
const surface=document.getElementById('surface'),overlay=document.getElementById('overlay'),ar=document.getElementById('ar'),reset=document.getElementById('reset');
const points=new Map();let previousDistance=0;
function send(packet){if(unityInstance)unityInstance.SendMessage('Interaction Input','Pointer',JSON.stringify(packet));}
function emit(ratio=1,hover){
 const list=[...points.values()];const point=list[0]||hover||{x:.5,y:.5};
 send({x:point.x,y:point.y,pressed:list.length>0,tracked:list.length>0||!!hover,ratio});
}
function cancel(){points.clear();previousDistance=0;emit();}
function point(e){const r=surface.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
function distance(){const a=[...points.values()];return a.length<2?0:Math.hypot((a[0].x-a[1].x)*surface.clientWidth,(a[0].y-a[1].y)*surface.clientHeight);}
surface.addEventListener('pointerdown',e=>{e.preventDefault();surface.setPointerCapture(e.pointerId);points.set(e.pointerId,point(e));previousDistance=distance();emit();});
surface.addEventListener('pointermove',e=>{
 if(!points.has(e.pointerId)){if(e.pointerType==='mouse')emit(1,point(e));return;}
 e.preventDefault();points.set(e.pointerId,point(e));const d=distance();let ratio=previousDistance>10&&d>10?d/previousDistance:1;previousDistance=d;emit(ratio);
});
function release(e){points.delete(e.pointerId);previousDistance=distance();emit();}
surface.addEventListener('pointerup',release);surface.addEventListener('pointercancel',()=>cancel());
surface.addEventListener('lostpointercapture',e=>{if(points.has(e.pointerId))release(e);});
surface.addEventListener('pointerleave',e=>{if(!points.size)emit();});
surface.addEventListener('wheel',e=>{e.preventDefault();if(points.size)emit(Math.exp(-e.deltaY*.002));},{passive:false});
surface.addEventListener('contextmenu',e=>e.preventDefault());
overlay.addEventListener('beforexrselect',e=>e.preventDefault());
window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel();});
// Supply a DOM overlay to the exporter without replacing its session lifecycle.
if(navigator.xr){const request=navigator.xr.requestSession.bind(navigator.xr);navigator.xr.requestSession=async(mode,options={})=>{
 if(mode==='immersive-ar')options={...options,requiredFeatures:[...new Set([...(options.requiredFeatures||[]),'dom-overlay'])],domOverlay:{root:overlay}};
 const session=await request(mode,options);
 if(mode==='immersive-ar'){xrSession=session;document.body.classList.add('ar');ar.textContent='Выйти из AR';session.addEventListener('end',()=>{cancel();xrSession=null;document.body.classList.remove('ar');ar.textContent='Начать AR';});}
 return session;
};}
reset.addEventListener('click',()=>{cancel();unityInstance.SendMessage('Interaction Input','ResetObject');});
ar.addEventListener('click',()=>{document.getElementById('error').textContent='';cancel();if(xrSession)xrSession.end();else unityInstance.Module.WebXR.toggleAR();});
window.addEventListener('unhandledrejection',e=>{document.getElementById('error').textContent='Не удалось запустить AR: '+e.reason;});
document.addEventListener('onARSupportedCheck',e=>{supported=e.detail.supported;ar.disabled=!supported||!unityInstance;if(!supported)ar.textContent='AR недоступен';});
window.addEventListener('pr7state',e=>{const s=e.detail;document.getElementById('status').textContent=(s.selected?'Куб захвачен':s.hovered?'Можно перетащить':'Коснитесь куба')+' · Масштаб '+Math.round(s.scale*100)+'%';});
var canvas=document.getElementById('unity-canvas');
var config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'MIREA',productName:'WebAR PR7',productVersion:'1.0',autoSyncPersistentDataPath:true};
{{{ WEBXR_POLYFILL_CONFIG }}}
const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').textContent=Math.round(p*100)+'%').then(instance=>{
 unityInstance=instance;window.unityInstance=instance;document.getElementById('loading').hidden=true;reset.disabled=false;ar.disabled=!supported;
}).catch(error=>{document.getElementById('error').textContent=String(error);document.getElementById('loading').hidden=true;});document.body.appendChild(script);
</script>
</body></html>
